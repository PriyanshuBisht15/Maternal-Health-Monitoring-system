<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maternal Health Registration</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#f6f8ff,#eef2ff,#fce7f3);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.container{
width:1100px;
max-width:100%;
display:grid;
grid-template-columns:1fr 1.4fr;
background:#fff;
border-radius:25px;
overflow:hidden;
box-shadow:0 20px 60px rgba(0,0,0,0.12);
}

.left{
background:linear-gradient(135deg,#7c3aed,#ec4899);
color:white;
padding:50px;
display:flex;
flex-direction:column;
justify-content:center;
}

.left h1{
font-size:42px;
font-weight:700;
line-height:1.2;
margin-bottom:20px;
}

.left p{
font-size:18px;
line-height:1.8;
opacity:0.95;
}

.left .badge{
margin-top:30px;
background:rgba(255,255,255,0.18);
padding:14px 18px;
border-radius:12px;
font-size:15px;
}

.right{
padding:45px;
}

.right h2{
font-size:34px;
color:#111827;
margin-bottom:10px;
}

.right p{
color:#6b7280;
margin-bottom:30px;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.input-box{
display:flex;
flex-direction:column;
}

.input-box.full{
grid-column:1/3;
}

label{
font-size:14px;
font-weight:500;
margin-bottom:8px;
color:#374151;
}

input{
padding:14px 16px;
border:1px solid #d1d5db;
border-radius:12px;
font-size:15px;
outline:none;
transition:0.3s;
}

input:focus{
border-color:#8b5cf6;
box-shadow:0 0 0 4px rgba(139,92,246,0.15);
}

button{
margin-top:28px;
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#7c3aed,#ec4899);
color:white;
font-size:17px;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(124,58,237,0.30);
}

.secure-box{
margin-top:22px;
background:#f9f5ff;
padding:14px;
border-radius:14px;
font-size:14px;
color:#6b21a8;
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

.left{
padding:35px;
}

.right{
padding:30px;
}

.form-grid{
grid-template-columns:1fr;
}

.input-box.full{
grid-column:auto;
}

}

</style>
</head>
<body>

<div class="container">

<div class="left">
<h1>Maternal Health Monitoring System</h1>
<p>
Register patient details for safe pregnancy monitoring,
AI based risk prediction and smart hospital care.
</p>

<div class="badge">
✔ Secure Records <br>
✔ Instant Risk Alerts <br>
✔ Doctor Dashboard
</div>
</div>

<div class="right">

<h2>Patient Registration</h2>
<p>Fill patient details below</p>

<form action="/register" method="POST">

<div class="form-grid">

<div class="input-box">
<label>Patient Name</label>
<input type="text" name="name" required>
</div>

<div class="input-box">
<label>Age</label>
<input type="number" name="age" required>
</div>

<div class="input-box">
<label>Contact</label>
<input type="text" name="contact" required>
</div>

<div class="input-box">
<label>Address</label>
<input type="text" name="address" required>
</div>

<div class="input-box full">
<label>Last Menstrual Period (LMP)</label>
<input type="date" name="lmp" required>
</div>

<div class="input-box">
<label>Hospital Name</label>
<input type="text" name="hospital" required>
</div>

<div class="input-box">
<label>Pregnancy History</label>
<input type="text" name="history">
</div>

</div>

<div class="secure-box">
🔒 Patient data securely stored in database
</div>

<button type="submit">Register Patient</button>

</form>

</div>
</div>

</body>
</html>
